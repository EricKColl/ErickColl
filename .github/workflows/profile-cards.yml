name: Update profile cards

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-cards.mjs"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate cards
        run: node scripts/generate-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs even if some card failed, so the ones that succeeded are still published.
      - name: Commit updated cards
        if: ${{ !cancelled() }}
        run: |
          git add assets/cards
          if git diff --cached --quiet; then
            echo "Cards are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile cards"
          git pull --rebase
          git push
