<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Section divider</title>
<desc id="desc">A thin signal line with a data packet travelling towards the central node.</desc>
<style>.mono { font-family: 'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; } .sans { font-family: Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; } .code { font: 600 11.5px 'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; letter-spacing: 2px; fill: #38bdf8; } .title { font: 500 11.5px 'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; letter-spacing: 2.5px; fill: #e8eef9; } .meta { font: 500 11px 'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; letter-spacing: 1.2px; fill: #6b7fa6; } .label { font: 600 10px 'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; letter-spacing: 1.8px; fill: #6b7fa6; } .body { font: 400 15px Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; fill: #a3b3cf; } .strong { font: 600 15px Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; fill: #e8eef9; } @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } } @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } } @keyframes spin { to { transform: rotate(360deg); } } @keyframes spin-reverse { to { transform: rotate(-360deg); } } @keyframes fade-in { from { opacity: 0; } } @keyframes rise { from { opacity: 0; transform: translateY(8px); } } @keyframes flow { to { stroke-dashoffset: -40; } } .pulse { animation: pulse 2.4s ease-in-out infinite; } .breathe { animation: breathe 4s ease-in-out infinite; } .flow { stroke-dasharray: 4 16; animation: flow 1.6s linear infinite; } .packet { animation: packet 7s cubic-bezier(.45,0,.55,1) infinite; } @keyframes packet { from { transform: translateX(-90px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateX(1000px); opacity: 0; } } @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }</style>
<defs><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/><stop offset=".3" stop-color="#3b82f6" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#38bdf8"/><stop offset=".7" stop-color="#a78bfa" stop-opacity=".55"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  <linearGradient id="packet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
<rect x="0" y="13.5" width="1000" height="1" fill="url(#beam)"/>
  <path d="M440 14h40l6-6h28l6 6h40" stroke="#38bdf8" stroke-opacity=".6"/>
  <path d="M500 6l8 8-8 8-8-8z" fill="#04070f" stroke="#38bdf8"/>
  <circle cx="500" cy="14" r="2.2" fill="#38bdf8" class="pulse"/>
  <rect class="packet" x="0" y="13" width="90" height="2" rx="1" fill="url(#packet)"/>
</svg>
