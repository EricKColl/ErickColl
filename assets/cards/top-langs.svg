<svg xmlns="http://www.w3.org/2000/svg" width="300" height="165" viewBox="0 0 300 165" fill="none" role="img" aria-labelledby="title">
  <title id="title">Most Used Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #70a5fd; }
    .lang-name { font: 400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #38bdae; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="299" height="164" fill="#1a1b27"/>
  <text x="25" y="35" class="header">Most Used Languages</text>
  <mask id="bar-mask"><rect x="0" y="0" width="250" height="8" rx="5" fill="white"/></mask>
  <g transform="translate(25, 55)" mask="url(#bar-mask)"><rect x="0.00" y="0" width="105.75" height="8" fill="#e34c26"/><rect x="105.75" y="0" width="40.10" height="8" fill="#4F5D95"/><rect x="145.85" y="0" width="37.37" height="8" fill="#f1e05a"/><rect x="183.22" y="0" width="29.74" height="8" fill="#f7523f"/><rect x="212.96" y="0" width="24.58" height="8" fill="#663399"/><rect x="237.54" y="0" width="12.46" height="8" fill="#3178c6"/></g>
  <g transform="translate(25, 80)">
    <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="5" fill="#e34c26"/>
      <text x="15" y="10" class="lang-name">HTML 42.30%</text>
    </g>
    <g transform="translate(150, 0)">
      <circle cx="5" cy="6" r="5" fill="#4F5D95"/>
      <text x="15" y="10" class="lang-name">PHP 16.04%</text>
    </g>
    <g transform="translate(0, 25)">
      <circle cx="5" cy="6" r="5" fill="#f1e05a"/>
      <text x="15" y="10" class="lang-name">JavaScript 14.95%</text>
    </g>
    <g transform="translate(150, 25)">
      <circle cx="5" cy="6" r="5" fill="#f7523f"/>
      <text x="15" y="10" class="lang-name">Blade 11.90%</text>
    </g>
    <g transform="translate(0, 50)">
      <circle cx="5" cy="6" r="5" fill="#663399"/>
      <text x="15" y="10" class="lang-name">CSS 9.83%</text>
    </g>
    <g transform="translate(150, 50)">
      <circle cx="5" cy="6" r="5" fill="#3178c6"/>
      <text x="15" y="10" class="lang-name">TypeScript 4.98%</text>
    </g>
  </g>
</svg>
