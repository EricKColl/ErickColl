<svg width="1200" height="4" viewBox="0 0 1200 4" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="30%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Línea base con degradado azul -->
  <rect width="1200" height="4" rx="2" fill="url(#base)"/>

  <!-- Destello que recorre la línea lentamente (10 segundos por pasada) -->
  <rect y="0" width="320" height="4" rx="2" fill="url(#glow)">
    <animate attributeName="x" values="-320;1200" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
